{% extends "base.html" %}
{% block title %}Skipped Files{% endblock %}

{% block content %}
<style>
    .sk-shell { display: flex; flex-direction: column; gap: 1rem; }
    .sk-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem;
        min-width: 0;
        overflow-wrap: anywhere;
    }
    @media (max-width: 640px) { .sk-card { padding: 1rem; } }
    .sk-lede { color: var(--text-sec); font-size: .9rem; line-height: 1.5; margin-top: .4rem; max-width: 62ch; }

    /* Filter: a segmented control, full width on phones */
    .sk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; margin-top: 1.25rem; }
    .sk-tabs {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px;
        background: var(--surface); border-radius: 9999px; flex: 1 1 18rem; max-width: 26rem;
    }
    .sk-tab {
        min-height: 2.25rem; border: 0; border-radius: 9999px; background: transparent; color: var(--text-sec);
        font-size: .85rem; font-weight: 500; cursor: pointer;
        transition-property: background-color, color; transition-duration: .15s;
    }
    .sk-tab[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--border); }
    .sk-count { color: var(--text-sec); font-size: .85rem; font-variant-numeric: tabular-nums; }

    /* Bulk actions for the tab on screen */
    .sk-bulk { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
    .sk-bulk .sk-btn[hidden] { display: none; }

    .sk-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
        min-height: 2.5rem; padding: .5rem 1rem; border-radius: 9999px;
        border: 1px solid var(--border); background: transparent; color: var(--text);
        font-size: .85rem; font-weight: 500; cursor: pointer; white-space: nowrap;
        transition-property: background-color, border-color, scale; transition-duration: .15s; transition-timing-function: ease-out;
        -webkit-tap-highlight-color: transparent;
    }
    .sk-btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
    .sk-btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
    .sk-btn:disabled { opacity: .5; cursor: default; }
    @media (hover: hover) {
        .sk-btn:not(:disabled):hover { background: var(--card-high); }
        .sk-btn.primary:not(:disabled):hover { background: color-mix(in srgb, var(--primary) 88%, var(--text)); }
        .sk-tab:hover { color: var(--text); }
    }
    @media (prefers-reduced-motion: no-preference) { .sk-btn:not(:disabled):active { scale: .96; } }
    @media (max-width: 640px) {
        .sk-bulk .sk-btn { flex: 1 1 calc(50% - .25rem); }
        .sk-btn { min-height: 2.75rem; }
        .sk-tab { min-height: 2.5rem; }
    }

    .sk-status p { font-size: .85rem; line-height: 1.45; padding: .6rem .8rem; border-radius: var(--radius-sm); background: var(--surface); margin-top: .75rem; }
    .sk-status p.err { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--text); }
    .sk-status p[hidden] { display: none; }

    /* One skipped file */
    .sk-name { font-weight: 600; line-height: 1.35; }
    .sk-meta { font-size: .8rem; color: var(--text-sec); margin-top: .25rem; font-variant-numeric: tabular-nums; }
    .sk-reason {
        display: flex; gap: .55rem; align-items: flex-start; margin-top: .75rem; padding: .6rem .8rem;
        border-radius: var(--radius-sm); font-size: .85rem; line-height: 1.45; color: var(--text);
        background: color-mix(in srgb, var(--warn) 12%, transparent);
    }
    .sk-reason i { color: var(--warn); margin-top: .2rem; }
    .sk-fix { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .5rem; margin-top: 1rem; }
    .sk-fix input {
        border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .6rem .8rem; min-height: 2.5rem;
        background: var(--bg); color: var(--text); font-size: .9rem; min-width: 0;
    }
    .sk-fix input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    @media (max-width: 640px) { .sk-fix input { font-size: 16px; min-height: 2.75rem; } }
    .sk-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
    .sk-result { font-size: .85rem; margin-top: .6rem; }
    .sk-result:empty { display: none; }
    .sk-result.ok { color: var(--ok); }
    .sk-result.err { color: var(--danger); }
    .sk-empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-sec); }
    .sk-pager { display: flex; gap: .75rem; justify-content: center; align-items: center; }
</style>

<div class="sk-shell">
    <section class="sk-card" aria-labelledby="sk-title">
        <h1 id="sk-title" class="page-title">Skipped files</h1>
        <p class="sk-lede">Files the indexer could not match. Add a title, an IMDb id (tt1234567) or a TMDB link, then press Retry.</p>

        <div class="sk-bar">
            <div class="sk-tabs" role="group" aria-label="Show">
                <button type="button" class="sk-tab" data-status="pending" aria-pressed="true" onclick="setStatus('pending')">Pending</button>
                <button type="button" class="sk-tab" data-status="ignored" aria-pressed="false" onclick="setStatus('ignored')">Ignored</button>
                <button type="button" class="sk-tab" data-status="missing" aria-pressed="false" onclick="setStatus('missing')">Missing</button>
            </div>
            <span id="sk-total" class="sk-count"></span>
        </div>

        <div class="sk-bulk">
            <button type="button" class="sk-btn primary" id="sk-retry-all" data-tabs="pending" onclick="retryAll()">Retry all</button>
            <button type="button" class="sk-btn" id="sk-import" data-tabs="pending ignored missing" onclick="importSkipChannel()">Import from skip channel</button>
            <button type="button" class="sk-btn" id="sk-ignore-all" data-tabs="pending" onclick="ignoreAll()">Ignore all</button>
            <button type="button" class="sk-btn danger" id="sk-remove-all" data-tabs="pending missing" onclick="removeAll()">Remove all</button>
            <button type="button" class="sk-btn danger" id="sk-delete-ignored" data-tabs="ignored" onclick="deleteIgnored()" hidden>Delete everything</button>
        </div>

        <div class="sk-status" role="status" aria-live="polite"><p id="sk-progress" hidden></p><p id="sk-import-status" hidden></p><p id="sk-remove-status" hidden></p></div>
    </section>

    <div id="sk-list" class="sk-shell" aria-live="off"></div>

    <nav class="sk-pager" aria-label="Pages">
        <button type="button" class="sk-btn" id="sk-prev" onclick="goPage(-1)">Previous</button>
        <span id="sk-page" class="sk-count"></span>
        <button type="button" class="sk-btn" id="sk-next" onclick="goPage(1)">Next</button>
    </nav>
</div>

<script>
let status = 'pending';
let page = 1;
let pages = 1;
let pollTimer = null;
let importRunning = false;
let removeRunning = false;
// Results show only for jobs started or seen running in this visit, never stale ones from earlier
const watching = { retry: false, import: false, remove: false };

function el(tag, attrs = {}, text = '') {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') e.className = v;
        else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v);
    }
    if (text) e.textContent = text;   // textContent: file names come from uploaders, never inject as HTML
    return e;
}

function showStatus(id, text, isError) {
    const p = document.getElementById(id);
    p.hidden = false;
    p.classList.toggle('err', !!isError);
    p.textContent = text;
}

async function api(url, opts) {
    const res = await fetch(url, opts);
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.detail || ('Request failed (' + res.status + ')'));
    return data;
}

function post(url, body) {
    return api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
}

function setStatus(s) {
    status = s; page = 1;
    document.querySelectorAll('.sk-tab').forEach(t => t.setAttribute('aria-pressed', String(t.dataset.status === s)));
    document.querySelectorAll('.sk-bulk [data-tabs]').forEach(b => { b.hidden = !b.dataset.tabs.split(' ').includes(s); });
    load();
}

function goPage(d) {
    const n = page + d;
    if (n < 1 || n > pages) return;
    page = n; load();
}

async function load() {
    const list = document.getElementById('sk-list');
    try {
        const data = await api('/api/admin/skipped?status=' + status + '&page=' + page);
        pages = Math.max(1, Math.ceil(data.total / data.per_page));
        document.getElementById('sk-total').textContent = data.total + ' file(s)';
        document.getElementById('sk-page').textContent = 'Page ' + page + ' / ' + pages;
        document.getElementById('sk-prev').disabled = page <= 1;
        document.getElementById('sk-next').disabled = page >= pages;
        updateProgress(data.retry_all);
        updateImport(data.import);
        updateRemove(data.remove_all);
        list.replaceChildren();
        if (!data.items.length) {
            list.append(el('div', { class: 'sk-card sk-empty' }, 'Nothing here.'));
            return;
        }
        data.items.forEach(item => list.append(renderItem(item)));
    } catch (e) {
        list.replaceChildren(el('div', { class: 'sk-card sk-empty' }, e.message));
    }
}

function renderItem(it) {
    const card = el('article', { class: 'sk-card' });
    card.append(el('div', { class: 'sk-name' }, it.caption || it.file_name || '(no name)'));
    if (it.caption && it.file_name && it.caption !== it.file_name) card.append(el('div', { class: 'sk-meta' }, 'File: ' + it.file_name));
    card.append(el('div', { class: 'sk-meta' }, it.size + ' · channel ' + it.chat_id + ' · msg ' + it.msg_id + (it.attempts ? ' · tried ' + it.attempts + 'x' : '')));
    const reason = el('div', { class: 'sk-reason' });
    reason.append(el('i', { class: 'fa-solid fa-triangle-exclamation', 'aria-hidden': 'true' }), el('span', {}, it.reason || 'No reason recorded.'));
    card.append(reason);

    const title = el('input', { placeholder: 'Full name, e.g. Show S02E05 (optional)', 'aria-label': 'Title to search', maxlength: '300', autocomplete: 'off' });
    const id = el('input', { placeholder: 'IMDb tt… or TMDB link/id', 'aria-label': 'IMDb or TMDB id', maxlength: '200', autocomplete: 'off' });
    const season = el('input', { placeholder: 'Season (optional)', 'aria-label': 'Season', type: 'number', min: '1', inputmode: 'numeric' });
    card.append(el('div', { class: 'sk-fix' }, '')); card.lastChild.append(title, id, season);

    const result = el('div', { class: 'sk-result' });
    const retry = el('button', { class: 'sk-btn primary' }, 'Retry');
    retry.addEventListener('click', async () => {
        retry.disabled = true; result.className = 'sk-result'; result.textContent = 'Working…';
        try {
            const r = await post('/api/admin/skipped/' + encodeURIComponent(it.id) + '/retry',
                { title: title.value, id: id.value, season: season.value });
            result.className = 'sk-result ' + (r.ok ? 'ok' : 'err');
            result.textContent = r.message;
            if (r.ok) setTimeout(load, 900);
        } catch (e) { result.className = 'sk-result err'; result.textContent = e.message; }
        retry.disabled = false;
    });
    const ignoring = status === 'ignored';
    const ignore = el('button', { class: 'sk-btn' }, ignoring ? 'Restore' : 'Ignore');
    ignore.addEventListener('click', async () => {
        try { await post('/api/admin/skipped/' + encodeURIComponent(it.id) + '/ignore', { ignored: !ignoring }); load(); }
        catch (e) { result.className = 'sk-result err'; result.textContent = e.message; }
    });
    const del = el('button', { class: 'sk-btn danger' }, 'Remove from list');
    del.addEventListener('click', async () => {
        try { await api('/api/admin/skipped/' + encodeURIComponent(it.id), { method: 'DELETE' }); load(); }
        catch (e) { result.className = 'sk-result err'; result.textContent = e.message; }
    });
    card.append(el('div', { class: 'sk-actions' }, ''));
    card.lastChild.append(retry, ignore, del);
    card.append(result);
    return card;
}

function updateProgress(st) {
    const btn = document.getElementById('sk-retry-all');
    if (st && st.running) {
        showStatus('sk-progress', 'Retrying: ' + st.done + ' / ' + st.total + ' done, ' + st.ok + ' indexed');
        btn.disabled = true;
        watching.retry = true;
        if (!pollTimer) pollTimer = setInterval(load, 3000);
    } else {
        btn.disabled = false;
        if (pollTimer && !importRunning && !removeRunning) { clearInterval(pollTimer); pollTimer = null; }
        if (watching.retry && st && st.total) showStatus('sk-progress', 'Retry all finished: ' + st.ok + ' of ' + st.total + ' indexed.');
    }
}

function updateImport(st) {
    importRunning = !!(st && st.running);
    const btn = document.getElementById('sk-import');
    if (st && st.running) {
        showStatus('sk-import-status', 'Importing: scanned ' + st.scanned + ' ids, ' + st.added + ' added');
        btn.disabled = true;
        watching.import = true;
        if (!pollTimer) pollTimer = setInterval(load, 3000);
    } else {
        btn.disabled = false;
        if (!watching.import || !st) return;
        showStatus('sk-import-status', st.error ? 'Import failed: ' + st.error : 'Import finished: ' + st.added + ' added of ' + st.found + ' files found.', !!st.error);
    }
}

function updateRemove(st) {
    removeRunning = !!(st && st.running);
    const btn = document.getElementById('sk-remove-all');
    btn.disabled = removeRunning;
    if (removeRunning) {
        showStatus('sk-remove-status', 'Removing skipped files and deleting their copies from the skip channel…');
        watching.remove = true;
        if (!pollTimer) pollTimer = setInterval(load, 3000);
    } else if (watching.remove && st && (st.records || st.failed)) {
        showStatus('sk-remove-status', 'Removed ' + (st.records || 0) + ' record(s); deleted ' + (st.messages || 0) + ' message(s) from the skip channel.'
            + (st.kept ? ' ' + st.kept + ' file(s) outside the skip channel were left in Telegram.' : '')
            + (st.failed ? ' ' + st.failed + ' could not be deleted and were moved to Ignored. (' + st.error + ')' : ''), !!st.failed);
    }
}

async function deleteIgnored() {
    let total;
    try { total = (await api('/api/admin/skipped?status=ignored')).total; } catch (e) { alert(e.message); return; }
    if (!total) { alert('No ignored files.'); return; }
    if (!confirm('Delete all ' + total + ' ignored files?\n\nTheir messages are deleted from the skip channel in Telegram and they leave this list. This cannot be undone.')) return;
    try { watching.remove = true; await post('/api/admin/skipped/delete-ignored'); load(); } catch (e) { alert(e.message); }
}

async function ignoreAll() {
    let total;
    try { total = (await api('/api/admin/skipped?status=pending')).total; } catch (e) { alert(e.message); return; }
    if (!total) { alert('No pending files.'); return; }
    if (!confirm('Ignore all ' + total + ' pending files? They move to the Ignored tab and will not come back on the next import.')) return;
    try {
        const r = await post('/api/admin/skipped/ignore-all');
        showStatus('sk-remove-status', 'Ignored ' + r.ignored + ' file(s).');
        load();
    } catch (e) { alert(e.message); }
}

async function removeAll() {
    let total;
    try { total = (await api('/api/admin/skipped?status=all')).total; } catch (e) { alert(e.message); return; }
    if (!total) { alert('Nothing to remove.'); return; }
    if (!confirm('Remove ALL ' + total + ' skipped files?\n\nEvery entry is deleted from this list and its copy is deleted from the skip channel in Telegram. This cannot be undone.')) return;
    try { watching.remove = true; await post('/api/admin/skipped/remove-all'); load(); } catch (e) { alert(e.message); }
}

async function importSkipChannel() {
    if (!confirm('Scan the skip channel and add every file in it to this list?')) return;
    try { watching.import = true; await post('/api/admin/skipped/import'); load(); } catch (e) { alert(e.message); }
}

async function retryAll() {
    if (!confirm('Retry every pending file? This runs in the background, one file per second.')) return;
    try { watching.retry = true; await post('/api/admin/skipped/retry-all'); load(); } catch (e) { alert(e.message); }
}

load();
</script>
{% endblock %}
